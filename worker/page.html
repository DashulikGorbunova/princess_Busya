<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff0f5">
<title>Принцесса Буся · Фотодневник</title>
<style>
:root{color-scheme:light;--ink:#49243a;--muted:#795369;--rose:#a6285b;--line:#eed3df;--paper:#fffafc;--pink:#ffe6ef}
*{box-sizing:border-box} body{margin:0;background:#fff5f8;color:var(--ink);font:1rem/1.55 system-ui,sans-serif}
button,input,textarea{font:inherit} button{cursor:pointer} [hidden]{display:none!important}
:focus-visible{outline:3px solid #7e2452;outline-offset:4px}
header{background:var(--paper);border-bottom:1px solid var(--line)}
.bar,main,footer{width:min(1120px,calc(100% - 48px));margin-inline:auto}
.bar{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{gap:12px;display:inline-flex;align-items:center;color:var(--ink);text-decoration:none;font-weight:750}.mark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#fbd4e4;color:#9d2e5b;font-size:1.25rem}
.hero{position:relative;isolation:isolate;display:grid;grid-template-columns:1.15fr 1fr;gap:38px;align-items:center;padding:clamp(28px,6vw,76px);margin-top:32px;background:radial-gradient(#e5a9bf 1px,transparent 1px) 0 0/18px 18px,#ffe6ef;border:1px solid #f0c5d6;border-radius:32px;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#ffe6ef 26%,#ffe6ef80 69%,transparent)}
.eyebrow{color:#86244e;font-size:.875rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase}
h1,h2,h3,figure{margin:0} h1,h2{font-family:Georgia,serif;font-weight:500;line-height:1.03}
h1{font-size:clamp(3rem,7vw,6.4rem);letter-spacing:-.07em;margin-block:12px 18px}
h1 em{color:var(--rose);font-weight:500} h2{font-size:clamp(2rem,4vw,3.4rem);letter-spacing:-.04em}
h3{font-size:1.05rem} p{margin:0 0 14px}.intro{max-width:32ch;font-size:1.1rem;color:var(--muted)}
.polaroid{position:relative;transform:rotate(5deg);padding:12px 12px 0;background:#fffafc;box-shadow:0 16px 36px #70234b29;border:1px solid #fff;border-radius:5px;max-width:405px;width:100%;justify-self:center}
.polaroid::before{content:'';position:absolute;left:35%;top:-11px;width:32%;height:25px;background:#f7a9c5c9;transform:rotate(-10deg);box-shadow:0 2px 4px #a8395a16}
.cover{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#f8c7da}
.polaroid figcaption{text-align:center;padding:13px 4px;font:italic 1.1rem Georgia,serif;color:#8b365d}.spark{position:absolute;right:-20px;bottom:23px;color:#a6285b;font-size:2.75rem;line-height:1}
section{margin-top:28px}.login,.empty,.notice{padding:26px;background:var(--paper);border:1px solid var(--line);border-radius:22px}.login{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}.login h2{font-size:2.15rem}.login p{margin:10px 0 0;color:var(--muted)}
label{display:grid;gap:6px;font-weight:650} input,textarea{width:100%;min-width:0;max-width:100%;border:1px solid #d9b4c6;border-radius:12px;background:white;color:var(--ink);padding:10px 12px} textarea{resize:vertical}
.inline{display:flex;align-items:center;gap:8px}.action,.quiet{border-radius:999px;min-height:44px;padding:9px 18px;font-weight:700;white-space:nowrap}.action{border:1px solid var(--rose);background:var(--rose);color:white}.action:hover{background:#8a1947}.quiet{background:var(--paper);color:#882451;border:1px solid var(--line)}.quiet:hover{background:#ffe6ef}button:disabled{opacity:.6;cursor:wait}
.error{color:#9a204b;font-weight:650;margin-top:8px!important}.error:empty{display:none}.section-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin:42px 0 20px}.section-head p{margin:8px 0 0;color:var(--muted)}.day{margin-top:24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-top:10px}.card{width:100%;border:1px solid var(--line);background:var(--paper);padding:9px;text-align:left;border-radius:16px;color:var(--ink)}.card:hover{border-color:var(--rose)}.card img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;background:#ffe7ef}.card span{display:block;padding:9px 4px 3px;overflow-wrap:anywhere}
.empty{text-align:center;border-style:dashed;padding:38px 20px}.empty .heart{font-size:1.7rem;color:var(--rose);display:block;margin-bottom:6px}.empty p{color:var(--muted);margin:6px 0 0}
footer{text-align:center;color:var(--muted);padding:28px 0 32px;font-size:.9rem}
dialog{width:min(480px,calc(100% - 30px));border-radius:22px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:22px;max-height:90dvh}dialog::backdrop{background:#3c132dbc}dialog h2{font-size:2rem}dialog form{display:grid;gap:14px}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.close{border-radius:50%;height:44px;width:44px;display:grid;place-items:center;border:1px solid var(--line);color:var(--rose);background:white;font-size:1.35rem;flex:none}.photo-view{width:min(850px,calc(100% - 30px))}.photo-view img{width:100%;max-height:70dvh;object-fit:contain;display:block}.photo-view p{margin:10px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.form-notice{margin:0;color:var(--muted)}
@media(max-width:680px){.bar,main,footer{width:calc(100% - 28px)}.bar{min-height:62px}.hero{grid-template-columns:1fr;gap:26px;margin-top:17px;border-radius:23px;padding:27px 24px 35px}.hero::before{background:linear-gradient(#ffe6ef 20%,transparent)}.polaroid{width:min(90%,330px);transform:rotate(3deg)}.login{grid-template-columns:1fr;gap:15px;padding:20px}.section-head{align-items:start;flex-wrap:wrap;margin-top:29px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}}
</style>
<script src="/app.js" defer></script>
</head>
<body>
<header><div class="bar"><a class="brand" href="/"><span class="mark" aria-hidden="true">♥</span> Дневник Буси</a><button class="quiet" id="logout" type="button" hidden>Выйти</button></div></header>
<main>
<div class="hero">
<div><div class="eyebrow">Фотоальбом на время практики</div><h1>Принцесса<br><em>Буся</em></h1>
<p class="intro">Пока ты на практике, сюда будут прилетать фотографии Буси из Сочи.</p></div>
<figure class="polaroid"><img class="cover" src="/hero.webp" alt="Йорк с розовым бантиком на обложке дневника" width="640" height="480"><span class="spark" aria-hidden="true">✦</span><figcaption>С любовью из Сочи ♡</figcaption></figure>
</div>
<section class="login" id="gate" aria-labelledby="gate-title">
<div><h2 id="gate-title">Вход в дневник</h2><p>Введите свой пароль, чтобы открыть альбом.</p></div>
<form id="login">
<label for="password">Пароль</label>
<div class="inline"><input id="password" type="password" required maxlength="128" autocomplete="current-password"><button class="action" type="submit">Войти</button></div>
<p class="error" id="login-error" role="alert"></p>
</form>
</section>
<section id="album" aria-labelledby="album-title" hidden>
<div class="section-head"><div><h2 id="album-title">Лента Буси</h2><p id="photo-count">Фотографии по дням</p></div><button class="action" id="add" type="button" hidden>＋ Добавить фото</button></div>
<div id="feed" aria-live="polite"></div>
</section>
</main>
<footer>Для Даши и её любимой Буси ♡</footer>
<dialog id="upload">
<div class="dialog-head"><h2>Добавить фото</h2><button class="close" data-close type="button" aria-label="Закрыть">×</button></div>
<form id="uploader">
<label>Фотография<input id="file" type="file" accept="image/*" required></label>
<label>Дата<input id="day" type="date" required></label>
<label>Подпись <textarea id="caption" maxlength="240" rows="2" placeholder="Например, Буся нашла любимую игрушку"></textarea></label>
<p class="error" id="upload-error" role="alert"></p>
<button class="action" type="submit">Отправить в альбом</button>
</form>
</dialog>
<dialog class="photo-view" id="viewer">
<div class="dialog-head"><h2 id="view-day">Фото</h2><button class="close" data-close type="button" aria-label="Закрыть">×</button></div>
<img id="view-image" alt="Фотография Буси"><p id="view-caption"></p>
</dialog>
</body></html>
